document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:#6FD6E8; text-decoration:none; }\na:hover { color:#E8E8E3; }\ninput { outline:none; }\nbutton { cursor:pointer; }\n::-webkit-scrollbar { width:0; height:0; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh; background:var(--canvas); display:flex; gap:48px; justify-content:center; align-items:flex-start; padding:48px 32px; font-family:'Karla', sans-serif\">\n  <sc-for list=\"{{ panes }}\" as=\"pane\" hint-placeholder-count=\"2\">\n    <div style=\"display:flex; flex-direction:column; gap:12px\">\n      <div style=\"font-size:11px; letter-spacing:1px; color:#5A5A56\">Focus Log · {{ pane.title }}<\u002Fdiv>\n      <div data-screen-label=\"{{ pane.title }}\" sc-camel-on-pointer-down=\"{{ pane.sd }}\" sc-camel-on-pointer-up=\"{{ pane.su }}\" style=\"width:390px; height:844px; background:var(--bg); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; color:var(--ink); user-select:none\">\n        <div style=\"height:40px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--dim); flex:none\">\n          <span>{{ clockNow }}<\u002Fspan>\n          <span>NET · 82%<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ pane.isClock }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-if value=\"{{ isIdle }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"flex:1; display:flex; flex-direction:column; padding:20px 24px 20px; min-height:0\">\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline\">\n                <span style=\"font-size:18px; letter-spacing:0.5px; color:var(--ink); font-weight:700\">Focus Log<\u002Fspan>\n                <button sc-camel-on-click=\"{{ pane.goStats }}\" style=\"background:none; border:none; font-family:inherit; font-size:13px; letter-spacing:0.5px; color:var(--dim); padding:4px 0\" style-hover=\"color:var(--ink)\">Stats →<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"margin-top:44px; font-size:14px; letter-spacing:0.5px; color:var(--ink); font-weight:600\">Minimum<\u002Fdiv>\n              <sc-if value=\"{{ editingMin }}\" hint-placeholder-val=\"{{ false }}\">\n                <input value=\"{{ minInput }}\" sc-camel-on-change=\"{{ minInputChange }}\" sc-camel-on-key-down=\"{{ minInputKey }}\" sc-camel-on-blur=\"{{ minInputBlur }}\" sc-camel-auto-focus=\"{{ true }}\" sc-camel-input-mode=\"numeric\" style=\"margin-top:8px; width:170px; background:transparent; border:none; border-bottom:1px solid var(--accent); font-family:'JetBrains Mono', monospace; font-size:48px; font-weight:300; color:var(--ink); padding:0\">\n              <\u002Fsc-if>\n              <sc-if value=\"{{ notEditingMin }}\" hint-placeholder-val=\"{{ true }}\">\n                <div sc-camel-on-pointer-down=\"{{ minDown }}\" sc-camel-on-pointer-move=\"{{ minMove }}\" sc-camel-on-pointer-up=\"{{ minUp }}\" style=\"margin-top:6px; font-family:'JetBrains Mono', monospace; font-size:56px; font-weight:300; color:var(--ink); line-height:1.1; cursor:ew-resize; touch-action:none; width:max-content\">{{ minDisplay }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"margin-top:6px; font-size:12px; color:#4A4A46\">Drag to adjust · Tap to type<\u002Fdiv>\n              <div style=\"margin-top:20px; display:flex; gap:8px\">\n                <sc-for list=\"{{ presets }}\" as=\"p\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ p.pick }}\" style=\"background:none; border:1px solid {{ p.bc }}; color:{{ p.fc }}; font-family:inherit; font-size:14px; padding:10px 16px; letter-spacing:0.5px; min-width:44px; border-radius:18px\">{{ p.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:40px; font-size:14px; letter-spacing:0.5px; color:var(--ink); font-weight:600\">Tag · Optional<\u002Fdiv>\n ustify-content:space-between; font-size:11px; color:#4A4A46\"><span>16 wk ago<\u002Fspan><span>today<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{ hasTagRows }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-top:32px; font-size:13px; letter-spacing:0.5px; color:var(--ink); font-weight:600\">This month by tag<\u002Fdiv>\n                <div style=\"margin-top:12px; display:flex; flex-direction:column; gap:8px\">\n                  <sc-for list=\"{{ tagRows }}\" as=\"t\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex; align-items:center; gap:10px\">\n                      <div style=\"width:72px; font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ t.name }}<\u002Fdiv>\n                      <div style=\"flex:1\"><div style=\"height:8px; width:{{ t.w }}; background:{{ t.c }}; border-radius:4px\"><\u002Fdiv><\u002Fdiv>\n                      <div style=\"width:56px; text-align:right; font-family:'JetBrains Mono', monospace; font-size:12px\">{{ t.v }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"margin-top:36px; display:flex; justify-content:space-between; align-items:baseline\">\n                <span style=\"font-size:13px; letter-spacing:0.5px; color:var(--ink); font-weight:600\">History<\u002Fspan>\n                <span style=\"font-size:11px; color:#4A4A46\">Hold an entry for actions<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasHistory }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-top:8px; display:flex; flex-direction:column\">\n                  <sc-for list=\"{{ history }}\" as=\"e\" hint-placeholder-count=\"8\">\n                    <div sc-camel-on-pointer-down=\"{{ e.pd }}\" sc-camel-on-pointer-up=\"{{ e.pu }}\" sc-camel-on-pointer-leave=\"{{ e.pu }}\" style=\"border-bottom:1px solid var(--line); padding:10px 0; display:flex; flex-direction:column; gap:4px\">\n                      <div style=\"display:flex; justify-content:space-between; font-size:13px\">\n                        <span style=\"font-family:'JetBrains Mono', monospace; color:var(--dim)\">{{ e.date }}&nbsp;&nbsp;{{ e.range }}<\u002Fspan>\n                        <span style=\"font-family:'JetBrains Mono', monospace; color:{{ e.durColor }}\">{{ e.dur }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:flex; justify-content:space-between; font-size:12px\">\n                        <span style=\"color:var(--accent)\">{{ e.tag }}<\u002Fspan>\n                        <sc-if value=\"{{ e.failed }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span style=\"color:var(--fail); letter-spacing:0.5px\">failed<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ e.open }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex; gap:20px; padding:6px 0 2px\">\n                          <button sc-camel-on-click=\"{{ e.del }}\" style=\"background:none; border:none; font-family:inherit; font-size:13px; letter-spacing:0.5px; color:var(--fail); padding:0\">Delete<\u002Fbutton>\n                          <button sc-camel-on-click=\"{{ e.editStart }}\" style=\"background:none; border:none; font-family:inherit; font-size:13px; letter-spacing:0.5px; color:var(--accent); padding:0\">Edit tag<\u002Fbutton>\n                          <button sc-camel-on-click=\"{{ e.cancel }}\" style=\"background:none; border:none; font-family:inherit; font-size:13px; letter-spacing:0.5px; color:var(--dim); padding:0\">Cancel<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ e.editing }}\" hint-placeholder-val=\"{{ false }}\">\n                        <input value=\"{{ editTagVal }}\" sc-camel-on-change=\"{{ editTagChange }}\" sc-camel-on-key-down=\"{{ editTagKey }}\" sc-camel-on-blur=\"{{ editTagBlur }}\" sc-camel-auto-focus=\"{{ true }}\" placeholder=\"tag (empty to clear)\" style=\"background:transparent; border:none; border-bottom:1px solid var(--accent); color:var(--ink); font-family:inherit; font-size:12px; padding:4px 0; width:180px\">\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noHistory }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:16px; font-size:12px; color:#4A4A46; letter-spacing:0.5px\">No sessions yet<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#6FD6E8&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#6FD6E8&quot;, &quot;#FFB454&quot;, &quot;#C9A0FF&quot;, &quot;#EDE96B&quot;], &quot;section&quot;: &quot;Tokens&quot;}, &quot;includeFailed&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Data&quot;}, &quot;freshInstall&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Data&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const sessions = this._load('sessions', null);\n    this.state = {\n      now: Date.now(),\n      paneScreens: { left: 'clock', right: 'stats' },\n      sessions: sessions || [],\n      active: this._load('active', null),\n      lastMin: this._load('lastMin', 60),\n      tags: this._load('tags', ['maths', 'thesis', 'reading']),\n      curTag: null,\n      editingMin: false, minInput: '',\n      addingTag: false, tagInput: '',\n      openId: null, editId: null, editTagVal: '', chartRange: 'All'\n    };\n    if (!sessions) { this.state.sessions = this._seed(); this._save('sessions', this.state.sessions); }\n    this._swipe = {}; this._press = null; this._scrub = null;\n  }\n  _load(k, d) { try { const v = localStorage.getItem('focuslog.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }\n  _save(k, v) { try { localStorage.setItem('focuslog.' + k, JSON.stringify(v)); } catch (e) {} }\n  componentDidMount() { this._iv = setInterval(() => this.setState({ now: Date.now() }), 500); this._applyAccent(); }\n  componentDidUpdate() { this._applyAccent(); }\n  componentWillUnmount() { clearInterval(this._iv); }\n  _applyAccent() { document.documentElement.style.setProperty('--accent', this.props.accent ?? '#6FD6E8'); }\n  _seed() {\n    const out = []; const tagPool = ['maths', 'thesis', 'reading', null, null];\n    const mins = [30, 45, 60, 90]; const dayMs = 86400000;\n    const today = new Date(); today.setHours(0, 0, 0, 0);\n    const hours = [8, 9, 10, 11, 14, 15, 16, 17, 20, 21];\n    for (let d = 28; d >= 0; d--) {\n      const day = today.getTime() - d * dayMs;\n      const dow = new Date(day).getDay();\n      let n = (dow === 0 || dow === 6) ? (Math.random() < 0.5 ? 0 : 1) : 1 + Math.floor(Math.random() * 3);\n      if (d === 0) n = 2;\n      for (let i = 0; i < n; i++) {\n        const h = hours[Math.floor(Math.random() * hours.length)];\n        const start = day + h * 3600000 + Math.floor(Math.random() * 50) * 60000;\n        if (start > Date.now() - 3600000) continue;\n        const minimum = mins[Math.floor(Math.random() * mins.length)];\n        const fail = Math.random() < 0.15;\n        const durMin = fail ? Math.max(4, Math.floor(minimum * (0.2 + Math.random() * 0.6))) : minimum + Math.floor(Math.random() * 35);\n        out.push({\n          id: start + '-' + i, start_epoch_ms: start, end_epoch_ms: start + durMin * 60000,\n          duration_ms: durMin * 60000, minimum_ms: minimum * 60000,\n          tag: tagPool[Math.floor(Math.random() * tagPool.length)],\n          status: fail ? 'failed' : 'completed', seeded: true\n        });\n      }\n    }\n    out.sort((a, b) => a.start_epoch_ms - b.start_epoch_ms);\n    return out;\n  }\n  _fmtDur(ms) { const m = Math.round(ms / 60000); const h = Math.floor(m / 60); const mm = m % 60; return h ? h + 'h ' + String(mm).padStart(2, '0') + 'm' : mm + 'm'; }\n  _fmtC(ms) { const m = Math.round(ms / 60000); const h = Math.floor(m / 60); const mm = m % 60; return h ? h + 'h ' + String(mm).padStart(2, '0') + 'm' : mm + 'm'; }\n  _fmtMin(ms) { const m = Math.round(ms / 60000); return String(m).padStart(2, '0') + ':00'; }\n  _fmtClock(ms) { const s = Math.floor(ms / 1000); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60; const p = n => String(n).padStart(2, '0'); return h ? h + ':' + p(m) + ':' + p(ss) : p(m) + ':' + p(ss); }\n  _setPane(key, scr) { this.setState(s => ({ paneScreens: { ...s.paneScreens, [key]: scr } })); }\n  _setMin(v) { const m = Math.min(240, Math.max(5, v)); this.setState({ lastMin: m }); this._save('lastMin', m); }\n  _end(status) {\n    const a = this.state.active; if (!a) return;\n    const end = Date.now();\n    const rec = { id: 's' + a.start, start_epoch_ms: a.start, end_epoch_ms: end, duration_ms: end - a.start, minimum_ms: a.minMs, tag: a.tag, status };\n    const ss = [...this.state.sessions, rec];\n    this.setState({ sessions: ss, active: null, curTag: null });\n    this._save('sessions', ss); this._save('active', null);\n  }\n  _commitEditTag() {\n    if (this.state.editId == null) return;\n    const t = this.state.editTagVal.trim() || null;\n    const ss = this.state.sessions.map(x => x.id === this.state.editId ? { ...x, tag: t } : x);\n    this.setState({ sessions: ss, editId: null, openId: null });\n    this._save('sessions', ss);\n  }\n  _commitNewTag() {\n    const t = this.state.tagInput.trim();\n    if (t) {\n      let tags = this.state.tags.filter(x => x !== t); tags.unshift(t); tags = tags.slice(0, 6);\n      this.setState({ tags, curTag: t, addingTag: false, tagInput: '' });\n      this._save('tags', tags);\n    } else this.setState({ addingTag: false, tagInput: '' });\n  }\n  renderVals() {\n    const st = this.state, now = st.now;\n    const includeFailed = this.props.includeFailed ?? false;\n    const fresh = this.props.freshInstall ?? false;\n    const visible = st.sessions.filter(s => !(fresh && s.seeded));\n    const countable = visible.filter(s => s.status === 'completed' || includeFailed);\n    const dayD = new Date(now); dayD.setHours(0, 0, 0, 0);\n    const d0 = dayD.getTime();\n    const w0 = d0 - ((new Date(now).getDay() + 6) % 7) * 86400000;\n    const nd = new Date(now);\n    const m0 = new Date(nd.getFullYear(), nd.getMonth(), 1).getTime();\n    const y0 = new Date(nd.getFullYear(), 0, 1).getTime();\n    const sum = a => a.reduce((x, s) => x + s.duration_ms, 0);\n    const since = t => sum(countable.filter(s => s.start_epoch_ms >= t));\n    const todayMs = since(d0), weekMs = since(w0);\n    const totals = [\n      { l: 'Today', v: this._fmtC(todayMs) }, { l: 'Week', v: this._fmtC(weekMs) },\n      { l: 'Month', v: this._fmtC(since(m0)) }, { l: 'Year', v: this._fmtC(since(y0)) },\n      { l: 'All', v: this._fmtC(sum(countable)) }\n    ];\n    const dimBar = 'color-mix(in oklab, var(--accent) 35%, transparent)';\n    const bars = (sums) => { const mx = Math.max(1, ...sums); return sums.map(v => ({ h: (v ? Math.max(4, Math.round(v / mx * 100)) : 0) + '%', c: v > 0 && v === mx ? 'var(--accent)' : dimBar })); };\n    const rangeDefs = [['Today', d0], ['Week', w0], ['Month', m0], ['Year', y0], ['All', 0]];\n    const ranges = rangeDefs.map(rd => ({ l: rd[0], fc: st.chartRange === rd[0] ? 'var(--accent)' : '#4A4A46', pick: () => this.setState({ chartRange: rd[0] }) }));\n    const rStart = (rangeDefs.find(rd => rd[0] === st.chartRange) || rangeDefs[4])[1];\n    const chartable = countable.filter(s => s.start_epoch_ms >= rStart);\n    const hourSum = Array(24).fill(0);\n    chartable.forEach(s => { hourSum[new Date(s.start_epoch_ms).getHours()] += s.duration_ms; });\n    const dowSum = Array(7).fill(0);\n    chartable.forEach(s => { dowSum[(new Date(s.start_epoch_ms).getDay() + 6) % 7] += s.duration_ms; });\n    const dowL = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];\n    const dowBars = bars(dowSum).map((b, i) => ({ ...b, l: dowL[i] }));\n    const weekSum = Array(10).fill(0);\n    countable.forEach(s => { const k = Math.floor((w0 + 7 * 86400000 - 1 - s.start_epoch_ms) / (7 * 86400000)); const idx = 9 - k; if (idx >= 0 && idx <= 9) weekSum[idx] += s.duration_ms; });\n    const heatStart = w0 - 15 * 7 * 86400000;\n    const dailySum = {};\n    countable.forEach(s => { const di = Math.floor((s.start_epoch_ms - heatStart) / 86400000); if (di >= 0 && di < 112) dailySum[di] = (dailySum[di] || 0) + s.duration_ms; });\n    const heatMax = Math.max(1, ...Object.values(dailySum), 1);\n    const heatCells = [];\n    for (let hr = 0; hr < 7; hr++) for (let hc = 0; hc < 16; hc++) {\n      const di = hc * 7 + hr; const t = heatStart + di * 86400000;\n      let col;\n      if (t > now) col = 'transparent';\n      else { const v = dailySum[di] || 0; col = v === 0 ? '#1B1B1E' : 'color-mix(in oklab, var(--accent) ' + Math.max(25, Math.round(v / heatMax * 100)) + '%, #16181A)'; }\n      heatCells.push({ c: col });\n    }\n    const byTag = {};\n    countable.filter(s => s.tag && s.start_epoch_ms >= m0).forEach(s => { byTag[s.tag] = (byTag[s.tag] || 0) + s.duration_ms; });\n    const tagEntries = Object.entries(byTag).sort((a, b) => b[1] - a[1]).slice(0, 5);\n    const tmax = Math.max(1, ...tagEntries.map(e => e[1]));\n    const tagRows = tagEntries.map(([name, v], i) => ({ name, v: this._fmtC(v), w: Math.max(2, Math.round(v / tmax * 100)) + '%', c: i === 0 ? 'var(--accent)' : dimBar }));\n    const history = visible.slice().sort((a, b) => b.start_epoch_ms - a.start_epoch_ms).slice(0, 60).map(s => {\n      const d = new Date(s.start_epoch_ms), e = new Date(s.end_epoch_ms);\n      const p = n => String(n).padStart(2, '0');\n      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];\n      return {\n        id: s.id,\n        date: days[d.getDay()] + ' ' + p(d.getDate()) + '/' + p(d.getMonth() + 1),\n        range: p(d.getHours()) + ':' + p(d.getMinutes()) + '–' + p(e.getHours()) + ':' + p(e.getMinutes()),\n        dur: this._fmtDur(s.duration_ms),\n        durColor: s.status === 'failed' ? 'var(--dim)' : 'var(--ink)',\n        tag: s.tag || '', failed: s.status === 'failed',\n        open: st.openId === s.id && st.editId !== s.id,\n        editing: st.editId === s.id,\n        pd: () => { clearTimeout(this._press); this._press = setTimeout(() => this.setState({ openId: s.id, editId: null }), 500); },\n        pu: () => clearTimeout(this._press),\n        del: () => { const ss = this.state.sessions.filter(x => x.id !== s.id); this.setState({ sessions: ss, openId: null }); this._save('sessions', ss); },\n        editStart: () => this.setState({ editId: s.id, editTagVal: s.tag || '' }),\n        cancel: () => this.setState({ openId: null, editId: null })\n      };\n    });\n    const panes = ['left', 'right'].map(key => {\n      const scr = st.paneScreens[key];\n      return {\n        key, isClock: scr === 'clock', isStats: scr === 'stats', title: scr === 'clock' ? 'CLOCK' : 'STATS',\n        goStats: () => this._setPane(key, 'stats'), goClock: () => this._setPane(key, 'clock'),\n        sd: ev => { this._swipe[key] = ev.clientX; },\n        su: ev => { const dx = ev.clientX - (this._swipe[key] ?? ev.clientX); if (Math.abs(dx) > 70) this._setPane(key, scr === 'clock' ? 'stats' : 'clock'); }\n      };\n    });\n    const presets = [30, 45, 60, 90].map(m => ({\n      label: m + 'm', bc: st.lastMin === m ? 'var(--accent)' : 'var(--line)', fc: st.lastMin === m ? 'var(--accent)' : 'var(--dim)',\n      pick: () => { this._setMin(m); this.setState({ editingMin: false }); }\n    }));\n    const tagChips = st.tags.map(t => ({\n      name: t, bc: st.curTag === t ? 'var(--accent)' : 'var(--line)', fc: st.curTag === t ? 'var(--accent)' : 'var(--dim)',\n      pick: () => this.setState({ curTag: this.state.curTag === t ? null : t })\n    }));\n    const active = st.active;\n    const elapsedMs = active ? Math.max(0, now - active.start) : 0;\n    const pastMin = active ? elapsedMs >= active.minMs : false;\n    const p2 = n => String(n).padStart(2, '0');\n    return {\n      panes, totals, dowBars, tagRows, history, presets, tagChips, ranges, heatCells,\n      hourBars: bars(hourSum), weekBars: bars(weekSum),\n      hasTagRows: tagRows.length > 0, hasHistory: history.length > 0, noHistory: history.length === 0,\n      clockNow: p2(nd.getHours()) + ':' + p2(nd.getMinutes()),\n      isIdle: !active, isRunning: !!active, pastMin, notPastMin: !pastMin,\n      inGrace: !!active && !pastMin && elapsedMs < 30000,\n      afterGrace: !!active && !pastMin && elapsedMs >= 30000,\n      cancelSession: () => { this.setState({ active: null }); this._save('active', null); },\n      elapsed: this._fmtClock(elapsedMs),\n      digitColor: pastMin ? 'var(--good)' : 'var(--pre)',\n      digitSize: elapsedMs >= 3600000 ? '60px' : '80px',\n      minLabel: active ? 'Min ' + this._fmtMin(active.minMs) : '',\n      activeTag: active && active.tag ? active.tag : '', hasActiveTag: !!(active && active.tag),\n      todayLabel: this._fmtDur(todayMs), weekLabel: this._fmtDur(weekMs),\n      minDisplay: this._fmtMin(st.lastMin * 60000),\n      editingMin: st.editingMin, notEditingMin: !st.editingMin, minInput: st.minInput,\n      addingTag: st.addingTag, notAddingTag: !st.addingTag, tagInput: st.tagInput, editTagVal: st.editTagVal,\n      start: () => { const a = { start: Date.now(), minMs: this.state.lastMin * 60000, tag: this.state.curTag }; this.setState({ active: a }); this._save('active', a); },\n      stop: () => this._end('completed'),\n      terminate: () => this._end('failed'),\n      minDown: ev => { ev.stopPropagation(); this._scrub = { x: ev.clientX, v: this.state.lastMin, moved: false }; try { ev.target.setPointerCapture(ev.pointerId); } catch (e) {} },\n      minMove: ev => { if (!this._scrub) return; const dx = ev.clientX - this._scrub.x; if (Math.abs(dx) > 4) this._scrub.moved = true; if (this._scrub.moved) this._setMin(this._scrub.v + Math.round(dx / 5)); },\n      minUp: () => { if (this._scrub && !this._scrub.moved) this.setState({ editingMin: true, minInput: String(this.state.lastMin) }); this._scrub = null; },\n      minInputChange: ev => this.setState({ minInput: ev.target.value.replace(/[^0-9]/g, '') }),\n      minInputKey: ev => { if (ev.key === 'Enter') ev.target.blur(); if (ev.key === 'Escape') this.setState({ editingMin: false }); },\n      minInputBlur: () => { const v = parseInt(this.state.minInput, 10); if (!isNaN(v)) this._setMin(v); this.setState({ editingMin: false }); },\n      addTagStart: () => this.setState({ addingTag: true, tagInput: '' }),\n      tagInputChange: ev => this.setState({ tagInput: ev.target.value }),\n      tagInputKey: ev => { if (ev.key === 'Enter') this._commitNewTag(); if (ev.key === 'Escape') this.setState({ addingTag: false, tagInput: '' }); },\n      tagInputBlur: () => this._commitNewTag(),\n      editTagChange: ev => this.setState({ editTagVal: ev.target.value }),\n      editTagKey: ev => { if (ev.key === 'Enter') this._commitEditTag(); if (ev.key === 'Escape') this.setState({ editId: null, openId: null }); },\n      editTagBlur: () => this._commitEditTag(),\n      exportLog: () => {\n        const esc = v => v == null ? '' : String(v);\n        const rows = [['start_iso', 'end_iso', 'duration_min', 'minimum_min', 'tag', 'status']];\n        visible.forEach(s => rows.push([new Date(s.start_epoch_ms).toISOString(), new Date(s.end_epoch_ms).toISOString(), Math.round(s.duration_ms / 60000), Math.round(s.minimum_ms / 60000), esc(s.tag), s.status]));\n        const csv = rows.map(r => r.join(',')).join('\\n');\n        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));\n        const a = document.createElement('a'); a.href = url; a.download = 'focus-log.csv'; a.click();\n        setTimeout(() => URL.revokeObjectURL(url), 1000);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
